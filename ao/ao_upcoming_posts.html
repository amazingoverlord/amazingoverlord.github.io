"Still made one at a time. That hasn't changed.\n\n#HandBound #BookBinding #MaterialsMatter #AnalogObjectStudio"}, {"date": "2026-07-29", "pillar": "Philosophy", "visual": "Minimal still life — all three formats, soft light", "caption": "The archive grows. One page at a time.\n\n#AnalogArchive #FormForThought #FillYours"}, {"date": "2026-08-01", "pillar": "Journey", "visual": "Vessel open on an outdoor café table, late afternoon light, summer heat", "caption": "August. The pace slows. The page doesn't.\n\n#AnalogPractice #FormForThought #VesselNotebook"}, {"date": "2026-08-05", "pillar": "Inspiration", "visual": "Close-up of worn map or travel-marked page, handwritten notes visible", "caption": "Every filled page is a record of where attention was paid.\n\n#AnalogArchive #FormForThought #FillYours"}, {"date": "2026-08-08", "pillar": "Craft", "visual": "Concertina and Dot Grid side by side, materials visible — thread, paper grain", "caption": "Two formats. Same thread. Same paper. Same hand.\n\n#HandBound #MaterialsMatter #VesselNotebook #AnalogObjectStudio"}, {"date": "2026-08-12", "pillar": "Philosophy", "visual": "Vessel in hand at a train platform or ferry dock, city behind", "caption": "The city moves. The page holds still. That's the point.\n\n#TheTravelingMind #AnalogPractice #FormForThought"}, {"date": "2026-08-15", "pillar": "Journey", "visual": "Sketchbook open to a drawing or watercolor in progress, outdoor light", "caption": "160gsm French mixed-media. It handles what you bring to it.\n\n#UrbanSketching #PleinAir #VesselNotebook #MaterialsMatter"}, {"date": "2026-08-19", "pillar": "Philosophy", "visual": "Minimal still life — all three Vessel formats on a linen surface, soft light", "caption": "Three formats. One practice. No notifications.\n\n#FormForThought #AnalogPractice #VesselNotebook #AnalogObjectStudio"}, {"date": "2026-08-22", "pillar": "Inspiration", "visual": "Atmospheric travel image — window seat, coast or countryside, notebook nearby", "caption": "\"Not all those who wander are lost.\" Some of them are filling Vessels.\n\n#TheTravelingMind #AnalogArchive #FormForThought"}, {"date": "2026-08-26", "pillar": "Craft", "visual": "Close-up of beeswax burnished cover aging gracefully, patina visible", "caption": "Beeswax develops with use. The cover you carry in August looks different by October. That's not wear. That's record.\n\n#BeeswaxFinish #HandBound #MaterialsMatter #AnalogObjectStudio"}, {"date": "2026-08-29", "pillar": "Philosophy", "visual": "Dot Grid open to a filled spread — dense notes, drawings, marks", "caption": "A filled Vessel is not an ending. It's an object that now has weight.\n\n#FillYours #AnalogArchive #FormForThought #VesselNotebook"}, {"date": "2026-09-02", "pillar": "Special", "visual": "All three formats arranged on a neutral surface — end of summer, clean and considered", "caption": "Summer ends. The archive doesn't.\n\nVessel: Dot Grid. Sketchbook. Concertina. All available now — link in bio.\n\n#VesselNotebook #FormForThought #AnalogObjectStudio #FillYours"}];

const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function parseDate(s) { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); }

const today = new Date(); today.setHours(0,0,0,0);
const upcoming = POSTS.filter(p => parseDate(p.date) >= today).slice(0,3);
const out = document.getElementById('out');

if (!upcoming.length) {
  out.innerHTML = 'No upcoming posts.';
} else {
  out.innerHTML = upcoming.map((p, i) => {
    const d = parseDate(p.date);
    const label = `${MONTHS[d.getMonth()]} ${d.getDate()}`;
    const parts = p.caption.split('\n\n');
    const body = parts[0];
    const tags = parts.slice(1).join(' ').trim();
    const sep = i < upcoming.length - 1 ? '<br><br>' : '';
    return `${label}  —  ${p.pillar}<br>Visual: ${p.visual}<br><br>Caption:<br>${body}<br>${tags}${sep}`;
  }).join('');
}
</script>
