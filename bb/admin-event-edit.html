<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="page-title">Create Event</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="page-header">
    <div class="container">
      <h2 style="margin:0;">RSVP Admin</h2>
      <a href="admin-dashboard.html" class="btn btn-secondary">Back to Dashboard</a>
    </div>
  </header>

  <main class="page-main">
    <div class="container" style="max-width: 640px;">
      <h1 id="form-heading">Create Event</h1>

      <form id="event-form" class="card mt-24">
        <div class="form-group">
          <label for="name-input">Event Name</label>
          <input type="text" id="name-input" name="name" required placeholder="e.g. Birthday Party" />
        </div>

        <div class="form-group">
          <label for="slug-input">Slug</label>
          <input type="text" id="slug-input" name="slug" required placeholder="birthday-party" />
          <p class="text-sm text-secondary" style="margin-top:4px;">Auto-generated from the name, but you can edit it.</p>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="date-input">Date</label>
            <input type="date" id="date-input" name="date" />
          </div>
          <div class="form-group">
            <label for="time-input">Time</label>
            <input type="text" id="time-input" name="time" placeholder="7:00 PM" />
          </div>
        </div>

        <div class="form-group">
          <label for="venue-input">Venue</label>
          <input type="text" id="venue-input" name="venue" placeholder="The Garden Room" />
        </div>

        <div class="form-group">
          <label for="venue-address-input">Venue Address</label>
          <input type="text" id="venue-address-input" name="venue_address" placeholder="123 Main St, New York, NY" />
        </div>

        <div class="form-group">
          <label for="additional-info-input">Additional Info</label>
          <textarea id="additional-info-input" name="additional_info" rows="3" placeholder="Dress code, parking, other notes for guests"></textarea>
        </div>

        <div class="form-group">
          <label for="deadline-input">RSVP Deadline</label>
          <input type="date" id="deadline-input" name="rsvp_deadline" />
        </div>

        <div class="form-group">
          <label class="radio-option" style="display:flex; align-items:center; gap:8px;">
            <input type="checkbox" id="active-checkbox" name="is_active" checked style="width:auto;" />
            Event is active (open for RSVP)
          </label>
        </div>

        <div class="error-message" id="form-error"></div>

        <div class="flex gap-8 mt-24">
          <button type="submit" class="btn btn-primary" id="save-btn">Save Event</button>
          <a href="admin-dashboard.html" class="btn btn-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="env.js"></script>
  <script src="js/ui-utils.js"></script>
  <script src="js/admin-auth.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/admin-event-edit.js"></script>
</body>
</html>
